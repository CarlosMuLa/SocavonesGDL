name: CI - Test & Validate (Python 3.9 + IaC)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.9 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9 (matches EC2 ~/geo_env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest cfn-lint
          python -m pip install --no-deps -e .

      - name: Validate YAML config & EC2 shell script syntax
        run: |
          bash -n scripts/setup_ec2_env.sh
          python -c "from socavones_gdl.config import load_config; cfg = load_config('config/zmg_config.yaml'); print('Config OK:', cfg.grid.crs, cfg.grid.resolution_m)"

      - name: Run pytest suite
        run: pytest -v

      - name: Lint CloudFormation template (cfn-lint)
        run: cfn-lint infra/cloudformation.yaml
